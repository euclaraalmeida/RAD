<article class="card">
  <h3><a href="{% url 'artigos:detalhe' post.slug %}">{{ post.titulo }}</a></h3>
  <p class="meta">{{ post.publicado_em|date:'d/m/Y' }} — <a href="{% url 'artigos:por_categoria' post.categoria.slug %}">{{ post.categoria.nome }}</a>{% if meus_posts %} · {{ post.get_situacao_display }}{% endif %}</p>
  <p>{{ post.resumo|default:post.conteudo|truncatewords:25 }}</p>
</article>
